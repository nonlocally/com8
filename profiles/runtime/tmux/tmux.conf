# Adapted from Anu 80d3c86; see profiles/NOTICE.md.
# Prefix
set -g prefix C-b
bind C-b send-prefix

# Reload config
bind q source-file @COM8_TMUX_CONFIG@

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "@COM8_COMMAND@ copy"

# Pane Controls
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

# Send this pane INTO another window (join into #N); C-b ! still breaks it to a NEW window
bind J command-prompt -p "send pane -> window:" "join-pane -t ':%%'"

# Yank a pane's id to the clipboard — paste it to an agent so it can message that
# pane through COM8. y = focused pane, Y = fzf-pick any pane
bind y run-shell "@COM8_COMMAND@ yank current #{pane_id}"
bind Y display-popup -E -w 70% -h 50% "@COM8_COMMAND@ yank pick"

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5
bind -n TripleClick1Pane resize-pane -Z

# Pane swap: right-click to mark source, right-click again to swap.
# '=' targets the pane under the mouse, including an inactive pane. Keep the
# mark in tmux itself so closing a marked pane cannot leave a stale shell ID.
bind -n MouseDown3Pane if-shell -F '#{pane_marked_set}' {
  swap-pane -t =
  select-pane -M
} {
  select-pane -m -t =
}

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
# Prompt for a name before creating an interactive window. Enter accepts the
# current directory basename; Esc cancels without creating a window.
bind c command-prompt -p "new window:" -I "#{b:pane_current_path}" "new-window -c \"#{pane_current_path}\" -n \"%%\""
bind U display-popup -E -w 60% -h 40% "@COM8_COMMAND@ shell twg"

bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P run-shell 'COM8_TMUX_CLIENT=#{q:client_name} @COM8_COMMAND@ shell _t_cycle -1'
bind N run-shell 'COM8_TMUX_CLIENT=#{q:client_name} @COM8_COMMAND@ shell _t_cycle 1'

# Pickers and popups (fzf via bash functions)
# A popup has no TMUX_PANE. Preserve the invoking client explicitly; a shared
# pane's inherited TMUX session and tmux's most-recent client are not its owner.
# run-shell -C expands formats before popup's literal command/environment args.
bind s run-shell -C 'display-popup -E -w 70% -h 60% -e COM8_TMUX_CLIENT=#{q:client_name} "@COM8_COMMAND@ shell tp"'
bind w run-shell -C 'display-popup -E -w 50% -h 40% -e COM8_TMUX_CLIENT=#{q:client_name} "@COM8_COMMAND@ shell twp"'
bind j run-shell -C 'display-popup -E -w 70% -h 50% -e COM8_TMUX_CLIENT=#{q:client_name} "@COM8_COMMAND@ shell tj"'
bind ` display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# Optional mesh binding is appended only when that module is selected.

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
setw -g aggressive-resize on
set -g detach-on-destroy off

# Prevent shell commands from overwriting window names
set -g allow-rename off
setw -g automatic-rename off

# Status bar
set -g status-position top
set -g status 2
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""

# Theme — Matte Black (multi-accent)
set -g status-style "bg=#121212,fg=#bebebe"
set -g status-left " "
set -g status-right "#[fg=#e68e0d]#{?client_prefix,PREFIX ,}#(tmux list-windows -t _stash 2>/dev/null | awk 'END{if(NR>0)printf \"S:%d \",NR}')#[fg=#8a8a8d]#h "
set -g window-status-format "#[fg=#5f9ea0] #I:#W "
set -g window-status-current-format "#[fg=#e68e0d,bold] #I:#W "
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#5f9ea0"
set -g message-style "bg=default,fg=#e68e0d"
set -g message-command-style "bg=default,fg=#e68e0d"
set -g mode-style "bg=#e68e0d,fg=#121212"
set -g popup-style "bg=default"
set -g popup-border-style "fg=#5f9ea0"
setw -g clock-mode-colour "#5f9ea0"

# Window/session status and optional private observer.
set -g status-format[1] "#{W:#[fg=#5f9ea0] #I:#W ,#[fg=#e68e0d,bold] #I:#W }#[align=right]#h "
set-hook -g client-session-changed 'run-shell "@COM8_COMMAND@ bar"'
set-hook -g session-created 'run-shell "@COM8_COMMAND@ bar"'
set-hook -g session-closed 'run-shell "@COM8_COMMAND@ bar"'
set-hook -g session-renamed 'run-shell "@COM8_COMMAND@ bar"'
run-shell -b "@COM8_COMMAND@ watch --ensure --socket '#{socket_path}'"
set-hook -g client-attached 'run-shell -b "@COM8_COMMAND@ watch --ensure --socket \"#{socket_path}\""'
set-hook -g after-new-window 'run-shell -b "@COM8_COMMAND@ watch --ensure --socket \"#{socket_path}\""'
set-hook -g after-split-window 'run-shell -b "@COM8_COMMAND@ watch --ensure --socket \"#{socket_path}\""'
bind -n C-Enter run-shell "@COM8_COMMAND@ tile new"
bind Space run-shell "@COM8_COMMAND@ tile cycle"
set-hook -g pane-exited 'run-shell "@COM8_COMMAND@ tile retile; @COM8_COMMAND@ watch --gc --socket \"#{socket_path}\""'
bind + split-window -h -c "#{pane_current_path}" \; select-layout tiled
bind - kill-pane
bind A display-popup -E -w 50% -h 35% -d "#{pane_current_path}" -T " launch agent " "@COM8_COMMAND@ shell al"

# Previous/next window (p/n — tmux defaults, kept explicit so helpers don't clobber them)
bind p previous-window
bind n next-window

# Additional detach shortcut; tmux's default 'd' remains available.
bind D detach-client

# Nested tmux toggle (F12)
# Press F12 to send all keys to inner/remote tmux session
# Press F12 again to take back local control
# Status bar dims when in pass-through mode
bind -T root F12 \
  set prefix None \;\
  set prefix2 None \;\
  set key-table off \;\
  set status-style "bg=red,fg=white" \;\
  set status-left "#[fg=white,bg=red,bold] #S #[bg=default] " \;\
  set status-right "#[fg=white,bg=red,bold] REMOTE #[bg=default] #[fg=brightblack]#h " \;\
  set status-format[0] "#[align=left fg=white,bg=red,bold] REMOTE #[bg=default]" \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u prefix2 \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u status-left \;\
  set -u status-right \;\
  set -u status-format[0] \;\
  run-shell "@COM8_COMMAND@ bar" \;\
  refresh-client -S

# Initialize session bar on config load
run-shell "@COM8_COMMAND@ bar"
