name: COM8 qualification
on:
  # Read the trusted base workflow; only maintainer branches may execute code.
  pull_request_target:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed source commit or tag; defaults to event revision
        type: string
        required: false
      release_qualification:
        description: Run canonical Homebrew and fresh onboarding qualification
        type: boolean
        default: false

permissions:
  contents: read

# Keep every main/release push; cancel only superseded PR runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  core:
    if: github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux, macOS]
        node: ['20', '22']
        # Retain both Node versions on Linux; the dashboard consumes Node 20.
        exclude: ${{ fromJSON(github.event_name == 'pull_request_target' && '[{"platform":"macOS","node":"20"}]' || '[]') }}
    runs-on:
      group: nonlocally-public-disposable
      labels: [self-hosted, "${{ matrix.platform }}", ARM64, isolated, disposable]
    timeout-minutes: 30
    steps:
      - name: Admit a fresh isolated guest before checking out job code
        uses: nonlocally/com8/.github/actions/disposable-admission@660cbd00dcc9c7ca2d6aa8dc84ab9dbe8d01ec7f
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Package the reviewed commit itself so the tested archive is publishable.
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/communicate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux jq bsdextrautils perl libdigest-sha-perl
      - name: macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install bash tmux jq
      - run: npm ci --ignore-scripts --loglevel=verbose
        working-directory: packages/communicate
      - run: npm run vendor
        working-directory: packages/communicate
      - name: Retained core and integration checks
        run: |
          python3 -B scripts/test-disposable-runner.py
          bash scripts/test-release-core.sh
      - name: Optional configuration checks
        run: |
          python3 scripts/test-profiles.py
          python3 scripts/test-com8-box.py
          bash scripts/test-snapshots.sh
      - name: Build immutable runtime
        run: |
          python3 scripts/test-build-release.py
          python3 scripts/build-release.py
      - name: Qualify the extracted runtime without checkout fallback
        run: |
          mkdir -p "$RUNNER_TEMP/com8-artifact"
          tar -xzf "dist/com8-$(cat VERSION).tar.gz" -C "$RUNNER_TEMP/com8-artifact"
          python3 scripts/qualify-installed.py "$RUNNER_TEMP/com8-artifact/com8-$(cat VERSION)" > "$RUNNER_TEMP/com8-artifact-qualification.json"
      - name: Qualify service adapters from the shipped runtime
        run: python3 -B scripts/test-bus-service.py --runtime "$RUNNER_TEMP/com8-artifact/com8-$(cat VERSION)"
      - name: Check fleet harness fixtures against the shipped runtime without SSH or providers
        run: python3 scripts/qualify-provider-fleet.py self-test "$RUNNER_TEMP/com8-artifact/com8-$(cat VERSION)" --archive "dist/com8-$(cat VERSION).tar.gz"
      - name: Check hosted qualification boundaries without network or providers
        run: python3 -B scripts/test-hosted-qualification.py
      - uses: actions/upload-artifact@v4
        with:
          name: com8-runtime-${{ runner.os }}-node${{ matrix.node }}
          path: dist/com8-*.tar.gz*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com8-qualification-${{ runner.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/com8-artifact-qualification.json
          if-no-files-found: warn
          retention-days: 7

  dashboard:
    needs: core
    if: github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on:
      group: nonlocally-public-disposable
      labels: [self-hosted, Linux, ARM64, isolated, disposable]
    timeout-minutes: 10
    steps:
      - name: Admit a fresh isolated guest before checking out job code
        uses: nonlocally/com8/.github/actions/disposable-admission@660cbd00dcc9c7ca2d6aa8dc84ab9dbe8d01ec7f
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Package the reviewed commit itself so the tested archive is publishable.
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: com8-runtime-Linux-node20
          path: ${{ runner.temp }}/com8-ui-artifact
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Qualify shipped dashboard assets
        run: |
          tar -xzf "$RUNNER_TEMP/com8-ui-artifact/com8-$(cat VERSION).tar.gz" -C "$RUNNER_TEMP/com8-ui-artifact"
          python scripts/qualify-browser.py "$RUNNER_TEMP/com8-ui-artifact/com8-$(cat VERSION)" --evidence "$RUNNER_TEMP/com8-ui-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com8-dashboard-qualification
          path: ${{ runner.temp }}/com8-ui-evidence
          if-no-files-found: warn
          retention-days: 7

  systemd:
    if: github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on:
      group: nonlocally-public-disposable
      labels: [self-hosted, Linux, ARM64, isolated, disposable]
    timeout-minutes: 20
    steps:
      - name: Admit a fresh isolated guest before checking out job code
        uses: nonlocally/com8/.github/actions/disposable-admission@660cbd00dcc9c7ca2d6aa8dc84ab9dbe8d01ec7f
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Package the reviewed commit itself so the tested archive is publishable.
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/communicate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build an independent immutable runtime
        run: |
          python3 scripts/build-release.py
          mkdir -p "$RUNNER_TEMP/com8-systemd-artifact"
          tar -xzf "dist/com8-$(cat VERSION).tar.gz" -C "$RUNNER_TEMP/com8-systemd-artifact"
      - name: Qualify actual scoped systemd service lifecycle on the disposable runner
        run: |
          python3 scripts/qualify-systemd.py "$RUNNER_TEMP/com8-systemd-artifact/com8-$(cat VERSION)" \
            --work "$RUNNER_TEMP/com8-systemd-evidence" --disposable-ci --start-user-manager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com8-systemd-qualification
          path: ${{ runner.temp }}/com8-systemd-evidence
          if-no-files-found: warn
          retention-days: 7

  homebrew:
    if: (github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/release/com8-public' || (github.event_name == 'workflow_dispatch' && inputs.release_qualification))
    # Canonical install/uninstall requires a clean supported macOS guest.
    runs-on:
      group: nonlocally-public-disposable
      labels: [self-hosted, macOS, ARM64, isolated, disposable]
    timeout-minutes: 45
    steps:
      - name: Admit a fresh isolated guest before checking out job code
        uses: nonlocally/com8/.github/actions/disposable-admission@660cbd00dcc9c7ca2d6aa8dc84ab9dbe8d01ec7f
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Package the reviewed commit itself so the tested archive is publishable.
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/communicate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check formula payload preservation through opt-linked reinstall paths
        run: |
          python3 -B scripts/test-homebrew-formula.py
          python3 -B scripts/test-homebrew-qualification.py
      - name: Build the immutable runtime independently of the core test matrix
        run: python3 scripts/build-release.py
      - name: Qualify canonical Homebrew install and reinstall on the disposable runner
        run: |
          version="$(cat VERSION)"
          archive="$GITHUB_WORKSPACE/dist/com8-$version.tar.gz"
          sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          python3 scripts/render-homebrew-formula.py "$version" "$sha" "$RUNNER_TEMP/com8.rb"
          python3 scripts/qualify-homebrew.py "$archive" "$RUNNER_TEMP/com8.rb" \
            --work "$RUNNER_TEMP/com8-brew-evidence" --disposable-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com8-homebrew-qualification
          path: ${{ runner.temp }}/com8-brew-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Qualify TTY cancellation and fresh automated dependency setup on the disposable runner
        run: |
          mkdir -p "$RUNNER_TEMP/com8-onboarding-artifact"
          tar -xzf "dist/com8-$(cat VERSION).tar.gz" -C "$RUNNER_TEMP/com8-onboarding-artifact"
          python3 scripts/qualify-onboarding.py "$RUNNER_TEMP/com8-onboarding-artifact/com8-$(cat VERSION)" \
            --work "$RUNNER_TEMP/com8-onboarding-evidence" --disposable-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com8-onboarding-qualification
          path: |
            ${{ runner.temp }}/com8-onboarding-evidence/report.json
            ${{ runner.temp }}/com8-onboarding-evidence/command-*.log
            ${{ runner.temp }}/com8-onboarding-evidence/interactive-cancel.log
          if-no-files-found: warn
          retention-days: 7

  qualification:
    # A skipped/untrusted PR is unqualified. This job runs trusted workflow
    # code only; it never checks out the PR's head or dispatch's source_ref.
    if: always()
    needs: [core, dashboard, systemd, homebrew]
    runs-on:
      group: nonlocally-public-disposable
      labels: [self-hosted, Linux, ARM64, isolated, disposable]
    timeout-minutes: 5
    steps:
      - name: Admit a fresh isolated guest
        uses: nonlocally/com8/.github/actions/disposable-admission@660cbd00dcc9c7ca2d6aa8dc84ab9dbe8d01ec7f
        with:
          expected-platform: linux
      - name: Require the qualification that this event requested
        env:
          CORE_RESULT: ${{ needs.core.result }}
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
          SYSTEMD_RESULT: ${{ needs.systemd.result }}
          HOMEBREW_RESULT: ${{ needs.homebrew.result }}
          HOMEBREW_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/release/com8-public' || (github.event_name == 'workflow_dispatch' && inputs.release_qualification) }}
        run: |
          test "$CORE_RESULT" = success
          test "$DASHBOARD_RESULT" = success
          test "$SYSTEMD_RESULT" = success
          if [ "$HOMEBREW_REQUIRED" = true ]; then
            test "$HOMEBREW_RESULT" = success
          else
            test "$HOMEBREW_RESULT" = skipped || test "$HOMEBREW_RESULT" = success
          fi
