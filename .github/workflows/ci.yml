name: COM8 qualification
on:
  pull_request:
  push:
    branches: [main, release/com8-public]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Package the reviewed commit itself so the tested archive is publishable.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/communicate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux jq bsdextrautils perl libdigest-sha-perl
      - name: macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install bash tmux jq
      - run: npm ci --ignore-scripts
        working-directory: packages/communicate
      - run: npm run vendor
        working-directory: packages/communicate
      - name: Retained core and integration checks
        run: bash scripts/test-release-core.sh
      - name: Optional configuration checks
        run: |
          python3 scripts/test-profiles.py
          python3 scripts/test-com8-box.py
          bash scripts/test-snapshots.sh
      - name: Build immutable runtime
        run: |
          python3 scripts/test-build-release.py
          python3 scripts/build-release.py
      - name: Qualify the extracted runtime without checkout fallback
        run: |
          mkdir -p "$RUNNER_TEMP/com8-artifact"
          tar -xzf "dist/com8-$(cat VERSION).tar.gz" -C "$RUNNER_TEMP/com8-artifact"
          python3 scripts/qualify-installed.py "$RUNNER_TEMP/com8-artifact/com8-$(cat VERSION)" > "$RUNNER_TEMP/com8-artifact-qualification.json"
      - name: Qualify service adapters from the shipped runtime
        run: python3 -B scripts/test-bus-service.py --runtime "$RUNNER_TEMP/com8-artifact/com8-$(cat VERSION)"
      - name: Check fleet harness fixtures against the shipped runtime without SSH or providers
        run: python3 scripts/qualify-provider-fleet.py self-test "$RUNNER_TEMP/com8-artifact/com8-$(cat VERSION)" --archive "dist/com8-$(cat VERSION).tar.gz"
      - name: Check hosted qualification boundaries without network or providers
        run: python3 -B scripts/test-hosted-qualification.py
      - uses: actions/upload-artifact@v4
        with:
          name: com8-runtime-${{ runner.os }}-node${{ matrix.node }}
          path: dist/com8-*.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com8-qualification-${{ runner.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/com8-artifact-qualification.json
          if-no-files-found: warn

  dashboard:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Package the reviewed commit itself so the tested archive is publishable.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: com8-runtime-Linux-node20
          path: ${{ runner.temp }}/com8-ui-artifact
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Qualify shipped dashboard assets
        run: |
          tar -xzf "$RUNNER_TEMP/com8-ui-artifact/com8-$(cat VERSION).tar.gz" -C "$RUNNER_TEMP/com8-ui-artifact"
          python scripts/qualify-browser.py "$RUNNER_TEMP/com8-ui-artifact/com8-$(cat VERSION)" --evidence "$RUNNER_TEMP/com8-ui-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com8-dashboard-qualification
          path: ${{ runner.temp }}/com8-ui-evidence
          if-no-files-found: warn

  systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Package the reviewed commit itself so the tested archive is publishable.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/communicate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build an independent immutable runtime
        run: |
          python3 scripts/build-release.py
          mkdir -p "$RUNNER_TEMP/com8-systemd-artifact"
          tar -xzf "dist/com8-$(cat VERSION).tar.gz" -C "$RUNNER_TEMP/com8-systemd-artifact"
      - name: Qualify actual scoped systemd service lifecycle on the disposable runner
        run: |
          python3 scripts/qualify-systemd.py "$RUNNER_TEMP/com8-systemd-artifact/com8-$(cat VERSION)" \
            --work "$RUNNER_TEMP/com8-systemd-evidence" --disposable-ci --start-user-manager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com8-systemd-qualification
          path: ${{ runner.temp }}/com8-systemd-evidence
          if-no-files-found: warn

  homebrew:
    # Current Homebrew bottles require a supported macOS release. Keep the
    # independent core matrix on macOS 14 to exercise older runtime support.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Package the reviewed commit itself so the tested archive is publishable.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/communicate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check formula payload preservation through opt-linked reinstall paths
        run: |
          python3 -B scripts/test-homebrew-formula.py
          python3 -B scripts/test-homebrew-qualification.py
      - name: Build the immutable runtime independently of the core test matrix
        run: python3 scripts/build-release.py
      - name: Qualify canonical Homebrew install and reinstall on the disposable runner
        run: |
          version="$(cat VERSION)"
          archive="$GITHUB_WORKSPACE/dist/com8-$version.tar.gz"
          sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          python3 scripts/render-homebrew-formula.py "$version" "$sha" "$RUNNER_TEMP/com8.rb"
          python3 scripts/qualify-homebrew.py "$archive" "$RUNNER_TEMP/com8.rb" \
            --work "$RUNNER_TEMP/com8-brew-evidence" --disposable-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com8-homebrew-qualification
          path: ${{ runner.temp }}/com8-brew-evidence
          if-no-files-found: warn
      - name: Qualify TTY cancellation and fresh automated dependency setup on the disposable runner
        run: |
          mkdir -p "$RUNNER_TEMP/com8-onboarding-artifact"
          tar -xzf "dist/com8-$(cat VERSION).tar.gz" -C "$RUNNER_TEMP/com8-onboarding-artifact"
          python3 scripts/qualify-onboarding.py "$RUNNER_TEMP/com8-onboarding-artifact/com8-$(cat VERSION)" \
            --work "$RUNNER_TEMP/com8-onboarding-evidence" --disposable-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com8-onboarding-qualification
          path: |
            ${{ runner.temp }}/com8-onboarding-evidence/report.json
            ${{ runner.temp }}/com8-onboarding-evidence/command-*.log
            ${{ runner.temp }}/com8-onboarding-evidence/interactive-cancel.log
          if-no-files-found: warn
